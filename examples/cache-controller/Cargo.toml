[package]
name = "cache-controller-example"
version = "0.1.0"
edition = "2024"
publish = false
description = "Benchmarkable adaptive cache controller example for RelayRL."

[dependencies]
relayrl = { path = "../../crates/relayrl", default-features = false, features = ["client"] }
relayrl_env_trait = { workspace = true }
relayrl_types = { workspace = true }

burn-ndarray = { workspace = true }
burn-tensor = { workspace = true }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
uuid = { workspace = true }
